spring:
  application:
    name: hoidanit-spring-rest-with-ai
  datasource:
    url: jdbc:mysql://localhost:3307/hr_management?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    web:
      pageable:
        one-indexed-parameters: true
  servlet:
    multipart:
      max-file-size: 5MB          # Servlet-layer limit, mapped to 400 by GlobalExceptionHandler
      max-request-size: 6MB       # file + metadata overhead

jwt:
  secret: hoidanitjwtsecretkeyHS256hoidanitjwtsecretkeyHS256hoidanitjwt
  expiration: 86400000

app:
  upload:
    base-dir: uploads              # relative to working dir, or absolute path
    max-size-bytes: 5242880        # 5 MB — business check (400)
    allowed-extensions: [jpg, jpeg, png, gif, webp]
    allowed-folders: [avatars, logos]

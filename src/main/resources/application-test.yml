spring:
  datasource:
    url: ${TEST_DB_URL}           # MySQL test database — NOT H2
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop       # Tạo schema khi test start, xóa khi kết thúc
    show-sql: false

jwt:
  secret: ${TEST_JWT_SECRET_KEY}
  expiration: 900000

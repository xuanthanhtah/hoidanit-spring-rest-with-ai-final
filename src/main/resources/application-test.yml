spring:
  datasource:
    # MySQL test database — NOT H2. Defaults match the local Docker container (port 3307).
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3307/hr_management_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop       # Tạo schema khi test start, xóa khi kết thúc
    show-sql: false
  data:
    web:
      pageable:
        one-indexed-parameters: true
  servlet:
    multipart:
      max-file-size: 5MB          # Servlet-layer limit, mapped to 400 by GlobalExceptionHandler
      max-request-size: 6MB       # file + metadata overhead

jwt:
  secret: ${TEST_JWT_SECRET_KEY:hoidanitjwtsecretkeyHS256hoidanitjwtsecretkeyHS256hoidanitjwt}
  expiration: 900000

app:
  upload:
    base-dir: target/test-uploads  # isolated from real uploads; cleaned by FileControllerTest
    max-size-bytes: 5242880
    allowed-extensions: [jpg, jpeg, png, gif, webp]
    allowed-folders: [avatars, logos]
